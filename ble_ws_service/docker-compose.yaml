# Explicit project name: without it the project is named after the directory
# ("ble_ws_service"), which collides with other services cloned the same way.
name: hubitat-august-ble

services:
  august-ble-ws-service:
    build: .
    container_name: august-ble-ws-service
    restart: unless-stopped
    # Shutdown closes WebSocket clients (up to 10s each) and then the locks; Docker's
    # default 10s would SIGKILL mid-shutdown and can leave a BlueZ link connected.
    stop_grace_period: 30s
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/dbus:/var/run/dbus
    network_mode: host
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # Limit each log file to 10MB
        max-file: "3"    # Keep only 3 log files before rotating
